{% extends 'base.html' %}
{% load role_tags %}

{% block title %}Assign Duty — PDMS{% endblock %}
{% block nav_duty %}active text-white{% endblock %}
{% block page_title %}Create Duty Assignment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card content-card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-clipboard-plus text-primary"></i> New Duty Assignment
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Officer <span class="text-danger">*</span></label>
                            <select name="officer" class="form-select" required>
                                <option value="">Select Officer...</option>
                                {% for o in officers %}
                                <option value="{{ o.id }}">{{ o.full_name }} ({{ o.badge_number }} — {{ o.rank }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date <span class="text-danger">*</span></label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Shift <span class="text-danger">*</span></label>
                            <select name="shift" class="form-select" required>
                                <option value="">Select Shift...</option>
                                <option value="MORNING">Morning (06:00-14:00)</option>
                                <option value="AFTERNOON">Afternoon (14:00-22:00)</option>
                                <option value="NIGHT">Night (22:00-06:00)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Assignment Type</label>
                            <input type="text" name="assignment_type" class="form-control" placeholder="e.g. Patrol, Security...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g. Downtown Sector 3">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Remarks</label>
                            <textarea name="remarks" class="form-control" rows="2" placeholder="Additional notes..."></textarea>
                        </div>
                    </div>
                    <hr class="my-3">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Assign Duty
                        </button>
                        <a href="{% url 'staff:duty_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
