{% extends 'base.html' %}
{% load role_tags %}

{% block title %}Add Equipment — PDMS{% endblock %}
{% block nav_equipment %}active text-white{% endblock %}
{% block page_title %}Add Equipment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card content-card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-tools text-primary"></i> Register New Equipment
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Item Name <span class="text-danger">*</span></label>
                            <input type="text" name="item_name" class="form-control" placeholder="e.g. Glock 19 Gen5" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Serial # <span class="text-danger">*</span></label>
                            <input type="text" name="serial_number" class="form-control" placeholder="e.g. SN-00123" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category <span class="text-danger">*</span></label>
                            <select name="category" class="form-select" required>
                                <option value="">Select...</option>
                                <option value="WEAPON">Weapon</option>
                                <option value="COMMUNICATION">Communication Equipment</option>
                                <option value="PROTECTIVE">Protective Gear</option>
                                <option value="FORENSIC">Forensic Kit</option>
                                <option value="SURVEILLANCE">Surveillance Equipment</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Purchase Date</label>
                            <input type="date" name="purchase_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Purchase Cost</label>
                            <input type="number" name="purchase_cost" class="form-control" step="0.01" placeholder="e.g. 15000.00">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Notes</label>
                            <input type="text" name="notes" class="form-control" placeholder="Additional info...">
                        </div>
                    </div>
                    <hr class="my-3">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Add Equipment
                        </button>
                        <a href="{% url 'fleet:equipment_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
